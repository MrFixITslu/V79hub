# Disposable GitHub Actions only. No published ports, real providers,
# production database, host mounts, customer mail or deployment credentials.
services:
  v79-hub:
    environment:
      V79_ECOSYSTEM_V2_EVENTS_ENABLED: "1"
      V79_TIQUET_EVENT_SECRET: "${STAGE_TIQUET_EVENT_SECRET:?Missing synthetic secret}"
      V79_WEBSITE_EVENT_SECRET: "${STAGE_WEB_EVENT_SECRET:?Missing synthetic secret}"
      STAGE_WEB_ADMIN_PASSWORD: "${STAGE_WEB_ADMIN_PASSWORD:?Missing synthetic website password}"
      V79_TRIAL_REMINDERS_ENABLED: "0"
      RESEND_API_KEY: ""
  tiquet:
    environment:
      V79_HUB_EVENT_URL: http://v79-hub:3040/api/platform/events
      V79_HUB_EVENT_SECRET: "${STAGE_TIQUET_EVENT_SECRET:?Missing synthetic secret}"
      V79_ECOSYSTEM_V2_EVENT_DELIVERY: "1"
      V79_ECOSYSTEM_V2_STRICT_INTAKE_IDENTITY: "1"
      INTAKE_SECRET: "${STAGE_INTAKE_SECRET:?Missing synthetic secret}"
      INTAKE_ACCOUNT_ID: "${STAGE_INTAKE_ACCOUNT_ID:-not-provisioned-yet}"
      V79_ECOSYSTEM_V2_INTAKE_ACK_ENABLED: "0"
      V79_ECOSYSTEM_V2_INVOICE_SEND_ENABLED: "0"
      V79_ECOSYSTEM_V2_CANCEL_ENABLED: "0"
      V79_ECOSYSTEM_V2_FEEDBACK_ENABLED: "0"
      V79_ECOSYSTEM_V2_DELIVERY_ACCEPTANCE_REQUIRED: "1"
      SMTP_HOST: ""
      SMTP_PASS: ""
      FFPRO_GATEWAY_URL: ""
  website:
    restart: "no"
    image: v79-v2-website:test
    networks: [sandbox]
    security_opt: ["no-new-privileges:true"]
    environment:
      GITHUB_ACTIONS: "true"
      V79_EPHEMERAL_CI: "1"
      NODE_ENV: production
      PORT: "3000"
      CAPTCHA_MODE: disabled
      CANONICAL_DOMAIN: http://website:3000
      ENCRYPTION_KEY: "${STAGE_WEB_ENCRYPTION_KEY:?Missing synthetic encryption key}"
      ADMIN_EMAIL: synthetic-admin@example.invalid
      ADMIN_PASSWORD: "${STAGE_WEB_ADMIN_PASSWORD:?Missing synthetic website password}"
      WEBSITE_HUB_SSO_ENFORCED: "false"
      WEBSITE_HUB_SSO_ENABLED: "false"
      V79_ECOSYSTEM_V2_REVIEW_MODE: "1"
      V79TIQUET_INTAKE_URL: http://tiquet:3050/api/public/intake
      V79TIQUET_INTAKE_SECRET: "${STAGE_INTAKE_SECRET:?Missing synthetic secret}"
      V79_HUB_EVENT_URL: http://v79-hub:3040/api/platform/events
      V79_HUB_EVENT_SECRET: "${STAGE_WEB_EVENT_SECRET:?Missing synthetic secret}"
      V79_HUB_ORGANIZATION_REF: synthetic-v79-internal
      RESEND_API_KEY: ""
    depends_on:
      v79-hub: {condition: service_healthy}
      tiquet: {condition: service_started}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
