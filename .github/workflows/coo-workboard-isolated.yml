name: COO workboard isolated validation

on:
  pull_request:
    branches: [feature/marketing-production-20261014]
    paths:
      - "server/owner-coo-workboard.mjs"
      - "src/components/OwnerCooWorkboardPanel.tsx"
      - "src/components/OwnerAssistant.tsx"
      - "server.ts"
      - "tests/owner-coo-workboard.test.mjs"
      - ".github/workflows/coo-workboard-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-coo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run exact-head, no-network COO authorization and GitHub response tests
        run: node --test tests/owner-coo-workboard.test.mjs
      - name: Verify TypeScript, isolated browser-DOM acceptance and build without publishing
        run: |
          npm ci --no-audit --no-fund
          node --test tests/owner-coo-workboard-ui.test.mjs
          npm run lint
          npm run build
