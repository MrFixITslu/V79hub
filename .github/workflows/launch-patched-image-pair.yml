name: Hardened Hub Tiquet exact OCI pair (isolated)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/launch-patched-image-pair.yml
      - tests/launch-patched-image-pair.test.mjs
concurrency:
  group: patched-pair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  exact-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiquet_test
          POSTGRES_USER: tiquet_test
          POSTGRES_PASSWORD: tiquet_test_password
        ports: [127.0.0.1:5432:5432]
        options: >-
          --health-cmd "pg_isready -U tiquet_test -d tiquet_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      hub-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hub_test
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test_password
        ports: [127.0.0.1:5433:5432]
        options: >-
          --health-cmd "pg_isready -U hub_test -d hub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      V79_PAIR_HUB_PG_URL: postgresql://hub_test:hub_test_password@127.0.0.1:5433/hub_test
      V79_PAIRED_TEST_SCOPE: github-ci-disposable
      DATABASE_URL: postgresql://tiquet_test:tiquet_test_password@127.0.0.1:5432/tiquet_test
      NODE_ENV: test
      WIPAY_ENABLED: '0'
      V79_ALLOW_PRODUCTION_DEPLOY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MrFixITslu/V79hub
          ref: c12e54bdb52f8996fae19688d74354d731e7de27
          path: .candidate-hub
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MrFixITslu/V79Tiquet
          ref: f47bbb65d1c81918017648a0a9b0464e4c167414
          path: .paired-tiquet
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact inputs and no tracked runtime data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .candidate-hub rev-parse HEAD)" = c12e54bdb52f8996fae19688d74354d731e7de27
          test "$(git -C .paired-tiquet rev-parse HEAD)" = f47bbb65d1c81918017648a0a9b0464e4c167414
          for path in .candidate-hub .paired-tiquet; do
            test ! -e "$path/.env"
            test -z "$(git -C "$path" ls-files -- data uploads backups logs)"
          done
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix .paired-tiquet --ignore-scripts --no-audit --no-fund
          node --check tests/launch-patched-image-pair.test.mjs
      - name: Build exact source-labelled disposable images
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg NODE_BASE=node:22-alpine --label org.opencontainers.image.revision=c12e54bdb52f8996fae19688d74354d731e7de27 -t v79-ci-patched-hub .candidate-hub
          docker build --build-arg NODE_BASE=node:22-alpine --label org.opencontainers.image.revision=f47bbb65d1c81918017648a0a9b0464e4c167414 -t v79-ci-patched-tiquet .paired-tiquet
          mkdir -p pair-evidence
          for image in v79-ci-patched-hub v79-ci-patched-tiquet; do
            docker image inspect "$image" --format '{{.Id}} {{index .Config.Labels "org.opencontainers.image.revision"}}' >> pair-evidence/images.txt
          done
      - name: Check actual production runtime has no package manager or test toolchain
        shell: bash
        run: |
          set -euo pipefail
          for image in v79-ci-patched-hub v79-ci-patched-tiquet; do
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 --entrypoint node "$image" -e '
              const fs=require("node:fs");
              for(const path of ["/usr/local/bin/npm","/usr/local/lib/node_modules/npm","/usr/bin/g++","/usr/bin/make"])
                if(fs.existsSync(path)) throw Error("Unexpected runtime build tool: "+path);
              for(const name of ["happy-dom","typescript","pg-mem"]){
                let found=false;try{require.resolve(name);found=true;}catch(e){if(e.code!=="MODULE_NOT_FOUND")throw e;}
                if(found)throw Error("Unexpected runtime test dependency: "+name);
              }
              console.log("PRODUCTION_TOOLCHAIN_BOUNDARY=PASS");'
          done
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 100:101 --entrypoint node v79-ci-patched-tiquet -e '
            const fs=require("node:fs");
            if(process.getuid()!==100||process.getgid()!==101)throw Error("User identity changed");
            let found=false;try{require.resolve("vite");found=true;}catch(e){if(e.code!=="MODULE_NOT_FOUND")throw e;}
            if(found)throw Error("Vite remains in Tiquet runtime");
            console.log("TIQUET_RUNTIME_USER_AND_NO_VITE=PASS");'
      - name: Install pinned vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.1
          cache: false
      - name: Scan both built images before acceptance and export
        shell: bash
        run: |
          set -euo pipefail
          trivy --version > pair-evidence/trivy-version.txt
          failed=0
          for app in hub tiquet; do
            trivy image --image-src docker --scanners vuln --ignore-unfixed=false \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --list-all-pkgs \
              --format json --output "pair-evidence/$app-vulnerabilities.json" --exit-code 0 \
              --timeout 10m "v79-ci-patched-$app" || failed=1
          done
          python3 - <<'PYCODE'
          import json, pathlib, subprocess
          summary = {}
          for app in ('hub','tiquet'):
              report = json.loads(pathlib.Path(f'pair-evidence/{app}-vulnerabilities.json').read_text())
              image = subprocess.check_output(['docker','image','inspect',f'v79-ci-patched-{app}','--format','{{.Id}}'],text=True).strip()
              assert report.get('Metadata',{}).get('ImageID') == image
              results = report.get('Results') or []
              assert any(r.get('Class') == 'os-pkgs' for r in results)
              assert any(r.get('Class') == 'lang-pkgs' for r in results)
              findings = [v for r in results for v in r.get('Vulnerabilities') or []]
              summary[app] = {'image':image,'high_critical':sum(v.get('Severity') in ('HIGH','CRITICAL') for v in findings),'all_findings':len(findings)}
          pathlib.Path('pair-evidence/vulnerability-summary.json').write_text(json.dumps(summary,indent=2))
          assert all(v['high_critical']==0 for v in summary.values()), 'HIGH/CRITICAL findings require remediation'
          PYCODE
          test "$failed" = 0
      - name: Exercise actual images with synthetic A/B tenants
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/launch-patched-image-pair.test.mjs | tee pair-evidence/test.txt
          test -z "$(git -C .candidate-hub status --porcelain --untracked-files=no)"
          test -z "$(git -C .paired-tiquet status --porcelain --untracked-files=no)"
      - name: Export only the exact images that passed acceptance
        shell: bash
        run: |
          set -euo pipefail
          docker save v79-ci-patched-hub v79-ci-patched-tiquet | gzip -1 > pair-evidence/patched-pair.docker.tar.gz
          test "$(stat -c %s pair-evidence/patched-pair.docker.tar.gz)" -lt 1073741824
          (cd pair-evidence && sha256sum patched-pair.docker.tar.gz images.txt test.txt > SHA256SUMS.txt)
      - name: Update antivirus signatures and scan every exported image component
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service
          sudo freshclam --stdout | tee pair-evidence/antivirus-update.txt
          clamscan --version | tee pair-evidence/antivirus-version.txt
          python3 - <<'PYCODE' | clamscan --fail-if-cvd-older-than=2 - > pair-evidence/antivirus-positive-control.txt && status=0 || status=$?
          import sys
          sys.stdout.write('X5O!P%@AP[4' + chr(92) + 'PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*')
          PYCODE
          test "$status" = 1
          grep -Eiq 'eicar.*FOUND' pair-evidence/antivirus-positive-control.txt
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,shutil,tarfile
          root=pathlib.Path('antivirus-components');root.mkdir()
          inventory=[];seen=set();total=0
          with tarfile.open('pair-evidence/patched-pair.docker.tar.gz',mode='r|gz') as archive:
              for member in archive:
                  if member.isdir():continue
                  assert member.isfile() and member.name not in seen
                  assert len(inventory)<2000 and 0<=member.size<1800*1024**2
                  seen.add(member.name);total+=member.size
                  assert total<8*1024**3
                  output=root/f'{len(inventory):06d}.bin'
                  with archive.extractfile(member) as data,output.open('xb') as dest:shutil.copyfileobj(data,dest)
                  with output.open('rb') as data:sha=hashlib.file_digest(data,'sha256').hexdigest()
                  if member.name.startswith('blobs/sha256/'):assert sha==member.name.removeprefix('blobs/sha256/')
                  inventory.append({'member':member.name,'bytes':member.size,'sha256':sha})
          assert inventory and 'manifest.json' in seen
          pathlib.Path('pair-evidence/antivirus-component-inventory.json').write_text(json.dumps(inventory,indent=2))
          PYCODE
          clamscan --recursive --infected --fail-if-cvd-older-than=2 --alert-exceeds-max=yes \
            --max-files=2000000 --max-recursion=30 --max-filesize=1800M --max-scansize=4000M \
            --max-scantime=900000 antivirus-components | tee pair-evidence/antivirus-scan.txt
      - name: Retain reports even when a security gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardened-pair-reports
          path: |
            pair-evidence/*.txt
            pair-evidence/*.json
          retention-days: 14
      - name: Retain candidate only after every security and acceptance gate passes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardened-pair-candidate
          path: pair-evidence/
          retention-days: 7
