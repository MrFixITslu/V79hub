name: G3 Hub launch acceptance contracts (nondeploying)
on:
  push:
    branches: [feature/hub-g3-launch-qa-contracts-20261015]
  pull_request:
    branches: [feature/marketing-production-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-g3-launch-qa:
    name: G3 exact-base onboarding, tenant, provider mock and negative cases
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: test
      V79_MCP_READONLY_ENABLE: "0"
      WIPAY_ENABLED: "0"
      V79_ALLOW_PRODUCTION_DEPLOY: "0"
      V79_HUB_STORE_BACKEND: json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove exact accepted G3 tracking ancestry and unchanged app
        shell: bash
        env:
          G3_TRACKING_BASE: ffae1c104d6ded918a0028f92c76624bc0501d8b
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$G3_TRACKING_BASE" HEAD
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/hub-g3-launch-qa-contracts.yml|docs/hub-g3-launch-qa-contracts.md) ;;
              *) echo "UNEXPECTED_APPLICATION_CHANGE=$changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$G3_TRACKING_BASE" HEAD)
          echo "TRACKING_BASE_APPLICATION_UNMODIFIED=PASS"
      - name: Install pinned dependencies with package scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full Hub TypeScript and lint
        run: npm run lint
      - name: Payment, Resend and invitation purely mocked negative contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/wipay-provider.test.mjs \
            tests/manual-payment-contract.test.mjs \
            tests/resend-transactional.test.mjs \
            tests/v79-invitation-delivery.test.mjs \
            tests/trial-reminders.test.mjs \
            tests/organization-access.test.mjs \
            tests/billing-contract.test.mjs \
            tests/g12-full-internal-billing-integration.test.mjs \
            tests/legacy-plan-migration.test.mjs
      - name: Ephemeral Hub HTTP signup, MFA, tenant, ticket and team tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/hub-security.test.mjs \
            tests/tiquet-tenant-contract.test.mjs \
            tests/team-invitation-flow.test.mjs \
            tests/invite-onboarding.test.mjs
      - name: Assert CI did not mutate tracked application source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
