name: G3 Hub launch acceptance contracts (nondeploying)
on:
  push:
    branches: [feature/hub-g3-launch-qa-contracts-20261015]
  pull_request:
    branches: [main, feature/marketing-production-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-g3-launch-qa:
    name: G3 exact-base onboarding, tenant, provider mock and negative cases
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: test
      V79_MCP_READONLY_ENABLE: "0"
      WIPAY_ENABLED: "0"
      V79_ALLOW_PRODUCTION_DEPLOY: "0"
      V79_HUB_STORE_BACKEND: json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove accepted G3 ancestry for cumulative integration candidate
        shell: bash
        env:
          G3_TRACKING_BASE: ffae1c104d6ded918a0028f92c76624bc0501d8b
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$G3_TRACKING_BASE" HEAD
          echo "TRACKING_BASE_ANCESTRY=PASS"
          echo "CUMULATIVE_SOURCE_SHA=$GITHUB_SHA"
      - name: Install pinned dependencies with package scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full Hub TypeScript and lint
        run: npm run lint
      - name: Payment, Resend and invitation purely mocked negative contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/wipay-provider.test.mjs \
            tests/manual-payment-contract.test.mjs \
            tests/resend-transactional.test.mjs \
            tests/v79-invitation-delivery.test.mjs \
            tests/trial-reminders.test.mjs \
            tests/organization-access.test.mjs \
            tests/billing-contract.test.mjs \
            tests/g12-full-internal-billing-integration.test.mjs \
            tests/legacy-plan-migration.test.mjs
      - name: Ephemeral Hub HTTP signup, MFA, tenant, ticket and team tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/hub-security.test.mjs \
            tests/tiquet-tenant-contract.test.mjs \
            tests/team-invitation-flow.test.mjs \
            tests/invite-onboarding.test.mjs
      - name: Assert CI did not mutate tracked application source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"


  paired-real-app:
    name: Real Hub + real Tiquet synthetic dual-tenant localhost acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_DB: tiquet_test
          POSTGRES_USER: tiquet_test
          POSTGRES_PASSWORD: tiquet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiquet_test -d tiquet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V79_PAIRED_TEST_SCOPE: github-ci-disposable
      DATABASE_URL: postgresql://tiquet_test:tiquet_test_password@127.0.0.1:5432/tiquet_test
      NODE_ENV: test
      WIPAY_ENABLED: "0"
      V79_MCP_READONLY_ENABLE: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact public Tiquet source ONLY for disposable CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MrFixITslu/V79Tiquet
          ref: 6f4d93c2f6ed2002eca6fb88bcba0e8bceacdd10
          path: .paired-tiquet
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Pin both exact sources and forbid tracked secrets/files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .paired-tiquet rev-parse HEAD)" = c8e00f1b3fe74ecdbfaf4fa60165c8dd3638e08e
          git merge-base --is-ancestor ffae1c104d6ded918a0028f92c76624bc0501d8b HEAD
          if [ -n "$(git ls-files -- data uploads backups logs)" ] ||
             [ -n "$(git -C .paired-tiquet ls-files -- data uploads backups logs)" ]; then
            echo 'CI source checkout unexpectedly tracks production runtime records' >&2
            exit 1
          fi
          test "$V79_PAIRED_TEST_SCOPE" = github-ci-disposable
          test "$DATABASE_URL" = postgresql://tiquet_test:tiquet_test_password@127.0.0.1:5432/tiquet_test
      - name: Install source dependencies without package lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix .paired-tiquet --ignore-scripts --no-audit --no-fund
      - name: Run actual localhost Hub and Tiquet with disposable A/B PostgreSQL
        run: node --test tests/paired-hub-tiquet-real-app.test.mjs
      - name: Assert no tracked application changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .paired-tiquet status --porcelain --untracked-files=no)"
