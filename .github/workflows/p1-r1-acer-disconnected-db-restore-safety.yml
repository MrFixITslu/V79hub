name: P1 R1 Acer disconnected database restore script safety (synthetic CI only)

on:
  pull_request:
    branches:
      - feature/p1-r1-runtime-contract-audit-20261016
    paths:
      - 'scripts/p1-r1-acer-disconnected-db-rehearsal.py'
      - 'tests/p1-r1-acer-disconnected-db-rehearsal.test.py'
      - 'scripts/p1-r1-acer-image-id-diagnostic.py'
      - 'tests/p1-r1-acer-image-id-diagnostic.test.py'
      - 'scripts/p1-r1-acer-oci-pin-proof.py'
      - 'scripts/p1-r1-acer-app-mount-preflight.py'
      - 'scripts/p1-r1-acer-four-image-boot.py'
      - 'scripts/p1-r1-acer-guarded-recovery-v2.sh'
      - 'tests/p1-r1-acer-four-image-boot.test.py'
      - 'tests/p1-r1-acer-oci-pin-proof.test.py'
      - '.github/workflows/p1-r1-acer-disconnected-db-restore-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy-and-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile without creating pycache or touching backup data
        run: |
          python -B - <<'PY'
          from pathlib import Path
          for name in ('scripts/p1-r1-acer-disconnected-db-rehearsal.py',
                       'tests/p1-r1-acer-disconnected-db-rehearsal.test.py',
                       'scripts/p1-r1-acer-image-id-diagnostic.py',
                       'tests/p1-r1-acer-image-id-diagnostic.test.py',
                       'scripts/p1-r1-acer-oci-pin-proof.py',
                       'scripts/p1-r1-acer-app-mount-preflight.py',
                       'scripts/p1-r1-acer-four-image-boot.py',
                       'tests/p1-r1-acer-four-image-boot.test.py',
                       'tests/p1-r1-acer-oci-pin-proof.test.py'):
              compile(Path(name).read_text(), name, 'exec')
          PY
      - name: Verify Acer swap guard syntax
        run: bash -n scripts/p1-r1-acer-guarded-recovery-v2.sh
      - name: Check source policy and synthetic manifest/permission negatives
        run: |
          python -B tests/p1-r1-acer-disconnected-db-rehearsal.test.py -v
          python -B tests/p1-r1-acer-image-id-diagnostic.test.py -v
          python -B tests/p1-r1-acer-oci-pin-proof.test.py -v
          python -B tests/p1-r1-acer-four-image-boot.test.py -v

# No Docker/Podman container runs, real database decrypt, GPG key, SSH,
# image import, artifact publication or production deployment in CI.
