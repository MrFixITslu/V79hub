name: S2 offline DB restore safety
on:
  push:
    branches:
      - feature/tiquet-release-gates-20261024
    paths:
      - scripts/v79_s2_offline_dual_pg_restore_v2.py
      - tests/test_s2_offline_dual_pg_restore_v2.py
      - scripts/v79_s2_offline_dual_pg_restore_v3.py
      - tests/test_s2_offline_dual_pg_restore_v3.py
      - .github/workflows/s2-offline-db-restore-safety.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-restore-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and pure self-test (no backup or service)
        run: |
          python3 -m py_compile scripts/v79_s2_offline_dual_pg_restore_v2.py
          python3 -B scripts/v79_s2_offline_dual_pg_restore_v2.py --self-test
      - name: Mocked tmpfs/network/cleanup negative tests
        run: python3 -B -m unittest discover -s tests -p 'test_s2_offline_dual_pg_restore_v2.py' -v
      - name: V3 strict PostgreSQL byte-count validation and simulated failures
        run: |
          python3 -m py_compile scripts/v79_s2_offline_dual_pg_restore_v3.py
          python3 -B scripts/v79_s2_offline_dual_pg_restore_v3.py --self-test
          python3 -B -m unittest discover -s tests -p 'test_s2_offline_dual_pg_restore_v3.py' -v
