name: P1 offhost metadata inventory (read only)
on:
  push:
    paths:
      - scripts/p1-offhost-metadata-readonly.py
      - tests/p1-offhost-metadata-readonly.test.py
      - .github/workflows/p1-offhost-metadata-readonly.yml
  pull_request:
    paths:
      - scripts/p1-offhost-metadata-readonly.py
      - tests/p1-offhost-metadata-readonly.test.py
      - .github/workflows/p1-offhost-metadata-readonly.yml
permissions:
  contents: read
jobs:
  pure-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B scripts/p1-offhost-metadata-readonly.py --self-test
      - run: python3 -B tests/p1-offhost-metadata-readonly.test.py
