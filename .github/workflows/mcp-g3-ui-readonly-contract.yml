name: G3 UI baseline + MCP owner read contract (no deployment)
on:
  push:
    branches: [feature/mcp-owner-readonly-g3-ui-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-g3-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject unreviewed changes and prove G3 server is preserved except MCP insertion
        run: |
          set -euo pipefail
          git diff --name-only 8d82b21a4defe47a3d377a57dcd648b3c9818fea HEAD |
          while IFS= read -r file; do
            case "$file" in
              server/mcp-owner-readonly.mjs|server.ts|tests/mcp-owner-readonly.test.mjs|.github/workflows/mcp-g3-ui-readonly-contract.yml|docs/mcp-g3-ui-release-candidate-20261015.md) ;;
              *) printf 'UNREVIEWED_CHANGE=%s\n' "$file"; exit 1 ;;
            esac
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          current=Path("server.ts").read_bytes()
          baseline=subprocess.check_output(["git","show","8d82b21a4defe47a3d377a57dcd648b3c9818fea:server.ts"])
          import_line=b'import { mcpReadAccessDecision } from "./server/mcp-owner-readonly.mjs";\n'
          first=b'// Separate owner-only MCP downstream read. DISABLED unless explicitly enabled'
          last=b'// Read-only, authenticated entitlement revalidation for existing product sessions.'
          assert current.count(import_line)==1
          assert current.count(first)==1
          assert current.count(last)==1
          first_pos=current.index(first)
          last_pos=current.index(last,first_pos)
          restored=current[:first_pos]+current[last_pos:]
          restored=restored.replace(import_line,b"",1)
          assert restored==baseline, "G3 UI server changed outside isolated MCP insertion"
          print("EXACT_G3_SERVER_PRESERVATION=PASS")
          PY
      - name: Run MCP authorization and G3-access regression tests
        run: node --test tests/mcp-owner-readonly.test.mjs tests/organization-access.test.mjs tests/agent-access.test.mjs
      - name: Install pinned dependencies without running lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck full G3 UI Hub source
        run: npm run lint
      - name: Test G3 marketing/UI and security parity
        run: node --test tests/marketing-production-panel.test.mjs tests/agent-approval-ledger.test.mjs
