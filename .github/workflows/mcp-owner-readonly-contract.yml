name: Hub MCP owner-only read contract (no deployment)
on:
  push:
    branches:
      - feature/mcp-owner-readonly-api-20261015
    paths:
      - 'server/mcp-owner-readonly.mjs'
      - 'server.ts'
      - 'tests/mcp-owner-readonly.test.mjs'
      - '.github/workflows/mcp-owner-readonly-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Hub MCP access-token and tenant isolation contracts
        run: node --test tests/mcp-owner-readonly.test.mjs
      - name: Verify existing organization and owner-agent access contracts
        run: node --test tests/organization-access.test.mjs tests/agent-access.test.mjs
      - name: Install lockfile-pinned dependencies (no scripts, no production secrets)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck complete Hub source without emitting files
        run: npm run lint
      - name: Verify no production changes or deployment scripts
        run: |
          git diff --name-only b450db70ece047f74aa502bca862a870e5d74c00 HEAD |
          while IFS= read -r file; do
            case "$file" in
              server/mcp-owner-readonly.mjs|server.ts|tests/mcp-owner-readonly.test.mjs|.github/workflows/mcp-owner-readonly-contract.yml) ;;
              *) printf 'UNREVIEWED_SOURCE_CHANGE=%s\n' "$file"; exit 1 ;;
            esac
          done
