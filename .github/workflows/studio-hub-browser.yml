name: Studio Hub MFA Review Browser (isolated only)
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/MarketingStudioApprovals.tsx"
      - "scripts/studio-hub-browser-acceptance.mjs"
      - ".github/workflows/studio-hub-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build this development UI without running prior passing suites
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install disposable Chromium only
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Local static server
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 --directory dist > "${RUNNER_TEMP}/studio-http.log" 2>&1 &
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4178/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: New desktop/mobile signed review and no-publish browser acceptance
        run: node scripts/studio-hub-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-hub-browser-synthetic
          path: preview-artifacts/studio-approvals/
          retention-days: 7
          if-no-files-found: warn
