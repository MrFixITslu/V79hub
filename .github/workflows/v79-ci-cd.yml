name: V79 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v79-ci-cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approval-pg-race:
    name: Isolated PostgreSQL two-process approval races
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      synthetic-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v79_ci_agent
          POSTGRES_PASSWORD: synthetic-ci-password-not-reused
          POSTGRES_DB: v79_ci_approval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v79_ci_agent -d v79_ci_approval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify independent approval writers against disposable PostgreSQL
        env:
          V79_APPROVAL_TEST_PG_URL: postgres://v79_ci_agent:synthetic-ci-password-not-reused@127.0.0.1:5432/v79_ci_approval
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test --test-concurrency=1 tests/agent-approval-live-postgres.test.mjs

  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and validate application
        shell: bash
        run: |
          set -euo pipefail
          run_project() {
            local dir="$1"
            echo "==> Checking $dir"
            pushd "$dir" >/dev/null
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            for script in lint check test build; do
              if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then
                npm run "$script"
              else
                echo "No $script script; skipping"
              fi
            done
            popd >/dev/null
          }
          run_project .
          if [ -f agent-service/package.json ]; then run_project agent-service; fi
          if [ -f backend/package.json ]; then run_project backend; fi
      - name: Verify Docker image can build
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --tag v79-ci-image .
      - name: Create delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar --exclude=.git --exclude=.env --exclude=data --exclude=dist \
              --exclude=node_modules --exclude=backend/node_modules --exclude='*.tar.gz' \
              -czf "${RUNNER_TEMP}/${GITHUB_REPOSITORY##*/}-${GITHUB_SHA::12}.tar.gz" .
      - name: Upload delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  deliver-container:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect Dockerfile
        id: docker
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable image
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        shell: bash
        run: |
          IMAGE="${{ steps.docker.outputs.image }}"
          SHORT_SHA="${GITHUB_SHA::12}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
      - name: Delivery note
        if: ${{ steps.docker.outputs.enabled != 'true' }}
        run: echo "No root Dockerfile; the release bundle is this repository's continuous-delivery artifact."

  deploy:
    name: Deploy Hub to server
    concurrency:
      group: v79-hub-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [validate, deliver-container]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Join deployment tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.DEPLOY_HOST }}
      - name: Configure pinned SSH access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "Missing production secret: $name" >&2; exit 1; fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Transfer release and deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo 'DEPLOY_SSH_PORT must be numeric' >&2; exit 1; }
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          archive="${RUNNER_TEMP}/release/${GITHUB_REPOSITORY##*/}-${GITHUB_SHA::12}.tar.gz"
          test -f "$archive"
          scp -P "$port" -o StrictHostKeyChecking=yes "$archive" "$target:v79-hub-release-${GITHUB_SHA}.tar.gz"
          ssh -p "$port" -o StrictHostKeyChecking=yes "$target" bash -s -- "$GITHUB_SHA" < scripts/deploy-server.sh