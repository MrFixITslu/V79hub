name: Skill Manager browser smoke (isolated synthetic)
on:
  push:
    branches: ["feature/skill-manager-prod-baseline-20261101"]
    paths:
      - "src/components/OwnerAssistant.tsx"
      - "src/components/WorkforceSkillManager.tsx"
      - "scripts/skill-manager-browser-qa.mjs"
      - ".github/workflows/workforce-skill-manager-browser.yml"
  pull_request:
    paths:
      - "src/components/OwnerAssistant.tsx"
      - "src/components/WorkforceSkillManager.tsx"
      - "scripts/skill-manager-browser-qa.mjs"
      - ".github/workflows/workforce-skill-manager-browser.yml"
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build production-baseline UI
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install disposable Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve isolated static preview
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 --directory dist > /tmp/skill-preview-http.log 2>&1 &
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4178/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exercise skill workflow at desktop and mobile sizes
        run: node scripts/skill-manager-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-manager-browser-synthetic
          path: preview-artifacts/skill-manager/
          retention-days: 7
          if-no-files-found: warn
