name: Remaining portfolio preflight safety
on:
  pull_request:
    paths:
      - scripts/portfolio-remaining-preflight.py
      - tests/portfolio-remaining-preflight.test.py
      - .github/workflows/portfolio-remaining-preflight.yml
  push:
    paths:
      - scripts/portfolio-remaining-preflight.py
      - tests/portfolio-remaining-preflight.test.py
      - .github/workflows/portfolio-remaining-preflight.yml
permissions:
  contents: read
jobs:
  readonly-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/portfolio-remaining-preflight.py --self-test
      - run: python3 -B tests/portfolio-remaining-preflight.test.py
      - run: python3 -B tests/portfolio-pinned-rollout.test.py
